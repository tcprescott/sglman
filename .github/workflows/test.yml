name: Tests

# Pull requests run this directly. Pushes to main and tags reach it through
# `workflow_call` from publish.yml, which gates the container build on it — so
# the suite that guards a release is the same one that guards a PR, and a main
# push runs it once rather than twice.
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# `github.workflow` is the *caller's* name inside a reusable workflow, so a PR
# run and the publish.yml run of the same suite never share a group.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so a Poetry release cannot break every job at once. Bump deliberately.
  POETRY_VERSION: '2.3.3'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-full-3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Ruff (blocking)
        run: poetry run ruff check .

      # Blocking, but as a ratchet: existing debt is baselined per file and only
      # a file that *gains* errors fails. See scripts/mypy_ratchet.py.
      - name: Mypy (ratchet)
        run: poetry run python scripts/mypy_ratchet.py

  guardrails:
    # The checks in .claude/scripts/ encode the invariants CLAUDE.md states —
    # layer boundaries, tenant scoping, async and datetime safety, feature-flag
    # gating, audit discipline. As Claude Code hooks they only fire inside a
    # Claude session; here they bind every commit, whoever wrote it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The runner diffs against the merge base, so it needs the history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Stdlib only — the checks import nothing outside the standard library,
      # so this job skips the Poetry install the other jobs need.
      - name: Guardrails (changed files)
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD~1"
          fi
          python scripts/guardrails.py --changed "$base"

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-full-3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run pytest (with coverage report)
        run: poetry run pytest -q --cov=application --cov=api --cov=middleware --cov-report=term-missing

  swiss-crossvalidation:
    # Cross-validate our Swiss engine against bbpPairings (a real FIDE-grade
    # Dutch engine). Kept as a separate job so the main matrix stays fast and is
    # not blocked on building the C++ binary.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned to a commit rather than tracking master: an upstream push would
      # otherwise change what we cross-validate against, mid-PR and unannounced.
      BBPPAIRINGS_REF: 8f9e3c5ffdc4d7a08a33d31c6fb49b4e7acef4d5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Build bbpPairings
        run: |
          git init bbpPairings
          git -C bbpPairings remote add origin https://github.com/BieremaBoyzProgramming/bbpPairings
          git -C bbpPairings fetch --depth 1 origin "$BBPPAIRINGS_REF"
          git -C bbpPairings checkout FETCH_HEAD
          make -C bbpPairings

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-full-3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run Swiss cross-validation tests
        env:
          BBPPAIRINGS_BIN: ${{ github.workspace }}/bbpPairings/bbpPairings.exe
        run: poetry run pytest tests/services/test_bracket_swiss_crossvalidation.py -q

  postgres:
    # The suite runs on SQLite, where some of what production relies on is a
    # silent no-op — SELECT ... FOR UPDATE most of all. This lane re-runs the
    # tests whose meaning depends on the real backend: the row-locking tests
    # (which fail here if the lock is removed, and cannot on SQLite) and the
    # tenant-isolation suite, which is the one that leans on real constraint
    # enforcement. Serial: each test drops and recreates the schema, so parallel
    # workers would pull the tables out from under each other.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wizzrobe
          POSTGRES_PASSWORD: wizzrobe
          POSTGRES_DB: wizzrobe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wizzrobe -d wizzrobe_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-full-3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Pytest (PostgreSQL backend)
        env:
          WIZZROBE_TEST_DB_URL: postgres://wizzrobe:wizzrobe@localhost:5432/wizzrobe_test
        run: poetry run pytest tests/postgres tests/tenancy -q -n0

  migrations:
    # Prove the full aerich migration chain applies from an empty PostgreSQL
    # database — the tests run on SQLite and never exercise the migrations.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wizzrobe
          POSTGRES_PASSWORD: wizzrobe
          POSTGRES_DB: wizzrobe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wizzrobe"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Install runtime dependencies
        run: poetry install --only main --no-interaction

      - name: Apply full migration chain to a fresh database
        env:
          DB_USERNAME: wizzrobe
          DB_PASSWORD: wizzrobe
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: wizzrobe
          ENVIRONMENT: development
        run: poetry run aerich upgrade

  browser:
    # pages/ + theme/ are ~34k lines the pytest suite does not cover, and their
    # Vue/Quasar slot templates run client-side: a bad `props.row.foo` in a table
    # slot renders a blank cell that no Python test can see. This job boots the
    # real app against a real PostgreSQL, seeds it, and walks the surfaces where
    # a blank render would cost the most — the short CI cousin of the full
    # /ui-validation loop, which stays a local tool.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wizzrobe
          POSTGRES_PASSWORD: wizzrobe
          POSTGRES_DB: wizzrobe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wizzrobe"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_NAME: wizzrobe
      DB_USERNAME: wizzrobe
      DB_PASSWORD: wizzrobe
      DB_HOST: localhost
      DB_PORT: 5432
      ENVIRONMENT: development
      # Every outbound integration is mocked: this job proves pages render, and
      # it must not depend on Discord, a randomizer, Challonge, Twitch or
      # racetime.gg being reachable from a CI runner.
      MOCK_DISCORD: 'true'
      MOCK_SEEDGEN: 'true'
      MOCK_CHALLONGE: 'true'
      MOCK_TWITCH: 'true'
      MOCK_RACETIME: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-full-3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Install Playwright Chromium
        # Pinned: Playwright ships browser-behaviour changes in minor releases,
        # and an unpinned bump would land as a mystery CI failure on an unrelated
        # PR. 1.56.1 matches the version preinstalled in the dev sandbox, so a
        # local /ui-validation run and this job drive the same browser.
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Generate a session secret
        run: echo "STORAGE_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"

      - name: Boot the app
        run: |
          setsid poetry run uvicorn main:app --workers 1 --log-level info \
            --port 8000 --host 127.0.0.1 > /tmp/app.log 2>&1 < /dev/null &
          # The FastAPI lifespan applies the migration chain on first boot, so
          # readiness is the signal to wait for, not a fixed sleep.
          for _ in $(seq 1 60); do
            grep -q 'Application startup complete' /tmp/app.log && exit 0
            sleep 2
          done
          echo "app did not become ready in 120s"; cat /tmp/app.log; exit 1

      - name: Seed fixtures
        run: poetry run python scripts/seed_dev.py

      - name: Walk the surfaces
        run: node scripts/ui_smoke.js scripts/ui_smoke_ci.json

      - name: App log
        if: always()
        run: tail -200 /tmp/app.log

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: /tmp/ui-smoke-ci/
          if-no-files-found: warn
